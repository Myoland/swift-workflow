# Invalid: credential-like names are rejected (access_token).
nodes:
  - id: start_id
    type: START
    inputs:
      query: String
  - id: llm_id
    type: LLM
    modelName: test-model
    request:
      stream: false
      inputs:
        - type: text
          role: user
          "#content": "{{ workflow.inputs.query }}"
      extraBody:
        access_token: x
  - id: end_id
    type: END
edges:
  - from: start_id
    to: llm_id
  - from: llm_id
    to: end_id
