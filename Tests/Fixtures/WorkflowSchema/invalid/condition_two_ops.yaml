# Invalid: one operator per condition object.
nodes:
  - id: start_id
    type: START
    inputs:
      query: String
  - id: llm_id
    type: LLM
    modelName: test-model
    request:
      stream: false
      inputs:
        - type: text
          role: user
          "#content": "{{ workflow.inputs.query }}"
  - id: end_id
    type: END
edges:
  - from: start_id
    to: llm_id
  - from: llm_id
    to: end_id
    condition:
      empty:
        variable: workflow.inputs.query
      contains:
        variable: workflow.inputs.query
        value: a
