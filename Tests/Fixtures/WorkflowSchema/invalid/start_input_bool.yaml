# Invalid: Bool is not a START input type (the decoder used to crash on it).
nodes:
  - id: start_id
    type: START
    inputs:
      query: String
      flag: Bool
  - id: llm_id
    type: LLM
    modelName: test-model
    request:
      stream: false
      inputs:
        - type: text
          role: user
          "#content": "{{ workflow.inputs.query }}"
  - id: end_id
    type: END
edges:
  - from: start_id
    to: llm_id
  - from: llm_id
    to: end_id
